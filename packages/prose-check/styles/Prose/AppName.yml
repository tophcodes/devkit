# A hausgold application named by its repository slug in running text.
# Prose names the application: "Dialer API" (or "dialer API"), never
# "dialer-api". A slug inside a repository path, a host name, an issue
# reference or a code span stays as it is.
extends: substitution
message: "Write '%s' instead of '%s'."
level: error
ignorecase: false
nonword: true
swap:
  '(?<![\w/.@:(-])analytic-api(?![\w#/-]|\.\w)': Analytic API
  '(?<![\w/.@:(-])asset-api(?![\w#/-]|\.\w)': Asset API
  '(?<![\w/.@:(-])automate-api(?![\w#/-]|\.\w)': Automate API
  '(?<![\w/.@:(-])calendar-api(?![\w#/-]|\.\w)': Calendar API
  '(?<![\w/.@:(-])dialer-api(?![\w#/-]|\.\w)': Dialer API
  '(?<![\w/.@:(-])formwizard-api(?![\w#/-]|\.\w)': Formwizard API
  '(?<![\w/.@:(-])identity-api(?![\w#/-]|\.\w)': Identity API
  '(?<![\w/.@:(-])inference-api(?![\w#/-]|\.\w)': Inference API
  '(?<![\w/.@:(-])lead-api(?![\w#/-]|\.\w)': Lead API
  '(?<![\w/.@:(-])maklerportal-api(?![\w#/-]|\.\w)': Maklerportal API
  '(?<![\w/.@:(-])payment-api(?![\w#/-]|\.\w)': Payment API
  '(?<![\w/.@:(-])property-api(?![\w#/-]|\.\w)': Property API
  '(?<![\w/.@:(-])verkaeuferportal-api(?![\w#/-]|\.\w)': Verkaeuferportal API
