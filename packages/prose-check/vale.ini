# Prose holds the rules from ~/.claude/rules/antithesis.md
# that a pattern can decide. Its errors block an outbound message in the
# prose-guard hook; its warnings are reported and never block.
#
# Slop is vale-llm-slop, at suggestion or warning. The write hook reports
# warnings and errors only, so the Slop rules precise enough to act on per hit
# are raised to warning. Overused and Hedging stay at suggestion: one hit says
# little, their signal is density.
StylesPath = styles
MinAlertLevel = suggestion

[*]
BasedOnStyles = Prose, Slop
# Prose.EmDash flags every em dash; Slop.EmDash only the third per paragraph.
Slop.EmDash = NO
Slop.Assistant = warning
Slop.Ceremony = warning
Slop.FillerConstruction = warning
Slop.ProcessNarration = warning
Slop.SelfHedging = warning
Slop.SelfReference = warning
